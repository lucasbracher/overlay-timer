; overlay-timer — default configuration file
; Default location: ~/.config/overlay-timer/config.ini
; All values can be overridden by command-line flags.
; Use --save to write (merging) the current options into this file.

[appearance]
; counter text color: name or #RRGGBB
color = red
; text visibility: 0 = transparent, 100 = opaque
alpha = 20
; text size as a % of the SMALLER screen dimension
size = 20
; font family (fontconfig); empty = system default font
font =

[position]
; corner: tl (top-left) | tr (top-right) | bl (bottom-left) | br (bottom-right)
corner = br
; screen index(es), comma-separated. E.g.: 0  or  0,1
screen = 0

[timer]
; display format: hhmmss | mmss  (the given time takes precedence)
format = mmss

[pomodoro]
; duration of each pomodoro (minutes)
pomodoro_minutes = 25
; short break duration (minutes)
break_minutes = 5
; long break duration (minutes)
long_break_minutes = 15
; long break every N pomodoros; 0 = no long break
long_break_every = 0
; color during the pomodoro
pomodoro_color = red
; color during the break
break_color = green

[audio]
; folder where the .wav files live
; expected files: timer_end.wav, pomodoro_end.wav, break_end.wav
sounds_dir = ~/.local/share/overlay-timer/sounds
; if the file does not exist, a synthesized triangular tone is used
; (long tone at the end of the timer/last pomodoro; short for the other endings)
enable_sound = true

[window]
; windowing system: auto | x11 | wayland | macos
backend = auto
